name = "skillowkey"
main = "api_worker.js"
compatibility_date = "2025-05-01"

# Serve everything in public/ as static assets (app + data + SEO pages).
# The API worker runs first for /api/* and /health only.
[assets]
directory = "public"
not_found_handling = "none"
run_worker_first = ["/api/*", "/health"]